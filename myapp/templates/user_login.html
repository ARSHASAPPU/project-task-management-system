{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Project Task Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="{% static 'CSS/user_login.css' %}" rel="stylesheet" />
</head>
<body>
    <main class="login-container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4 login-card">
            <h3 class="card-title text-center mb-4">Login to Your Account</h3>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="inputEmail" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" id="inputEmail" placeholder="Enter email or username" required />
                    <div class="invalid-feedback">
                        Please enter your email or username.
                    </div>
                </div>
                <div class="mb-3">
                    <label for="inputPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword" placeholder="Enter password" required minlength="6" />
                    <div class="invalid-feedback">
                        Please enter your password (minimum 6 characters).
                    </div>
                </div>
                {% comment %} <div class="mb-3 text-end">
                    <a href="#" class="forgot-password-link">Forgot Password?</a>
                </div> {% endcomment %}
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </main>
    
    <script>
        (() => {
            'use strict';
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', e => {
                e.preventDefault();
                e.stopPropagation();

                if(form.checkValidity()) {
                    alert('Login successful (simulated).');
                    // TODO: replace with actual authentication logic
                } else {
                    form.classList.add('was-validated');
                }
            });
        })();
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
